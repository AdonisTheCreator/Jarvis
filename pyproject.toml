[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "Jarvis Core: capability router, policy engine, canonical memory, audit ledger, proactivity plane."
requires-python = ">=3.11"
# The core stays small and vendor-free on purpose (docs/04 Rule 3).
# cryptography is the ONE third-party dependency, and it is crypto, which is
# the last thing that should be hand-rolled.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
